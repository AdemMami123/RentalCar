<header class="site-header" [class.header-scrolled]="scrolled">
  <a class="brand" routerLink="/home" (click)="closeMenu()" aria-label="RentalCar home">
    <span class="brand-mark">R</span><span>Rental<span>Car</span></span>
  </a>
  <button class="menu-toggle" type="button" (click)="toggleMenu()" [attr.aria-expanded]="menuOpen" aria-label="Toggle navigation"><span></span><span></span><span></span></button>
  <nav class="navigation" [class.navigation-open]="menuOpen" aria-label="Main navigation">
    <a routerLink="/cars" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()">Explore cars</a>
    <a routerLink="/bookings" routerLinkActive="active" (click)="closeMenu()">My bookings</a>
    <a routerLink="/home" fragment="how-it-works" (click)="closeMenu()">How it works</a>
    <ng-container *ngIf="user$ | async as user; else guestActions">
      <a class="profile-link" routerLink="/profile" routerLinkActive="active" (click)="closeMenu()"><span class="avatar">{{ (user.firstName || user.email).charAt(0).toUpperCase() }}</span><span class="profile-copy"><small>Signed in as </small>{{ user.firstName || user.email }}</span></a>
      <button class="logout-button" type="button" (click)="logout()">Log out</button>
    </ng-container>
    <ng-template #guestActions><a class="login-link" routerLink="/login" (click)="closeMenu()">Sign in</a><a class="join-button" routerLink="/register" (click)="closeMenu()">Create account</a></ng-template>
  </nav>
</header>
