<main class="auth-page"><section class="auth-panel"><p class="eyebrow">RentalCar / member access</p><h1>Welcome back</h1><p class="intro">Sign in to manage your reservations and profile.</p><form [formGroup]="form" (ngSubmit)="submit()" novalidate><label>Email<input type="email" formControlName="email" autocomplete="email"></label><label>Password<input type="password" formControlName="password" autocomplete="current-password"></label><p class="error" *ngIf="error">{{ error }}</p><button type="submit" [disabled]="form.invalid || submitting">{{ submitting ? 'Signing in...' : 'Sign in' }}</button></form><p class="switch">New here? <a routerLink="/register">Create an account</a></p></section></main>
