<main class="auth-page"><section class="auth-panel"><p class="eyebrow">RentalCar / membership</p><h1>Start your journey</h1><p class="intro">Create an account and keep every reservation in one place.</p><form [formGroup]="form" (ngSubmit)="submit()" novalidate><div class="row"><label>First name<input formControlName="firstName" autocomplete="given-name"></label><label>Last name<input formControlName="lastName" autocomplete="family-name"></label></div><label>Email<input type="email" formControlName="email" autocomplete="email"></label><label>Password<input type="password" formControlName="password" autocomplete="new-password"></label><p class="error" *ngIf="error">{{ error }}</p><button type="submit" [disabled]="form.invalid || submitting">{{ submitting ? 'Creating...' : 'Create account' }}</button></form><p class="switch">Already registered? <a routerLink="/login">Sign in</a></p></section></main>
